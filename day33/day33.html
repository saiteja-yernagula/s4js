callback functions
when a function definiton is passed to another func
as an argument and later executes in outer func

function one(callback){
    console.log('one')
    callback()
}

function two(callback){
    setTimeout(() => { 
        console.log('two')
        callback()
    }, 2000);
}

function three(callback){
    console.log('three')
    callback()
}
function four(){
    console.log('four')
}

one(()=>{
    two(()=>{
        three(()=>{
            four()
        })
    })
})

pending
