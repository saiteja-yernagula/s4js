<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 >heading1</h1>
    <h1 class="demo">heading2</h1>
    <div class="demo" id="el">content 1</div>
    <div class="demo">content 2</div>
    <div class="demo">content 2</div>
    <div class="demo">content 2</div>
    <div class="demo">content 2</div>
    <div class="demo">content 2</div>
    <div class="demo">content 2</div>
    <script>
        /*
dom - document object model
it is a standard object model that allows scripts and program
to update the structure , style and content

dom has methods and properties
methods are for accessing 
properties are for manipulating

dom has two types of objects
1) document level
2) element level objects
console.log(document)//complete code in a doc


dom methods for accessing a elements
1) getElementsByTagName()- it is used to get the references 
of elements based on a tagname and return in 
collection of an array 

let headings= document.getElementsByTagName('h1')
console.log(headings)

//first heading
console.log(headings[0])

2) getElementsByClassName()-it is used to get the references 
of elements based on a classnames and return in 
collection of an array 
        
let elements= document.getElementsByClassName('demo')
console.log(elements)

//last one
console.log(elements[elements.length-1])

3) getElementById()- it is used to get the reference of an 
element based on id and returns single element
let div= document.getElementById('el')
console.log(div)

4) querySelector()
it is used to return the single element of the first precedence
based on tagname, .classname and id

let elbytag=document.querySelector('h1')
console.log(elbytag)
let elbyclass=document.querySelector('.demo')
console.log(elbyclass)
let elbyid=document.querySelector('#el')
console.log(elbyid)

5) querySelectorAll()-it is used to return the collection of
 elements based on tagname, .classname and id
 let elbytag=document.querySelectorAll('h1')
console.log(elbytag)
*/
let elbytag=document.querySelectorAll('#el')
console.log(elbytag)
</script>
</body>
</html>
