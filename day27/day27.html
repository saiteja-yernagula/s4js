<script>
 /*
 number methods
 1) Number
 it is used to convert the string into number
 let a='123'
 console.log(typeof(Number(a)))


 2) toFixed 
 it is used format the number into fixed decimal places
 and returns string

 let num=92.4
 console.log(num.toFixed(2))//92.60
 console.log(num.toFixed(2))//92.00
 console.log(num.toFixed(0))//93

 3) parseInt
 it is used to extract a whole number from a string
 and it stops checking when it hit non number
 and returns nan if it doesnot find anything
let data='12    3hello'
 console.log(parseInt("123hello"))//123
 console.log(parseInt("12  3   hello"))//12
 console.log(parseInt("12.3hello"))//12
 console.log(parseInt("hello12.3hello"))//NaN

 4) parseFloat
 it is used to extract a decimal number from a string
 let data='12    3hello'
 console.log(parseFloat("123hello"))//123
 console.log(parseFloat("12.3hello"))//12.3

 5) isNaN()
 it is used to check whether the value is not a number 
 or a number
 if it is not a number it will return true
 if it is  a number it will return false
console.log(isNaN("hello"))//true
console.log(isNaN(undefined))//true
console.log(isNaN("123hello"))//true
console.log(isNaN(123))//false
console.log(isNaN("123"))//false
console.log(isNaN(false))//false

math methods
1) Math.ceil()
it is used to round up the number to the next largest integer
console.log(Math.ceil(9.1))//10
console.log(Math.ceil(9.9))//10
console.log(Math.ceil(-9.9))//-9
console.log(Math.ceil(-9.1))//-9

2) Math.floor()
it is used to round down the number to the smallest integer
console.log(Math.floor(9.1))//9
console.log(Math.floor(9.9))//9
console.log(Math.floor(-9.9))//-10
console.log(Math.floor(-9.1))//-10

3) Math.round()
it is used to round of the number to the nearest integer
console.log(Math.round(9.1))//9
console.log(Math.round(9.9))//10
console.log(Math.round(-9.9))//-10
console.log(Math.round(-9.1))//-9

4) Math.random()
 it will generate number from 0-1
console.log(Math.floor(Math.random()*10000))

let arr=['quotes1','some quote2','3 quote']
console.log(arr[Math.floor(Math.random()*arr.length)])

5) Math.trunc()
it is used to truncate the decimal points
console.log(Math.trunc("9.9"))//9

converts negative number into absolute num
